name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile fofatoto.py
      - name: Unit tests
        run: python -m unittest test_fofatoto -v
      - name: Version sync check (APP_VERSION / pyproject / uv.lock)
        run: |
          APP_V=$(python - <<'EOF'
          import re
          src = open('fofatoto.py', encoding='utf-8').read()
          print(re.search(r'APP_VERSION\s*=\s*"([^"]+)"', src).group(1))
          EOF
          )
          PY_V=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          LOCK_V=$(sed -n 's/^version = "\(.*\)"/\1/p' uv.lock | head -1)
          echo "APP_VERSION=$APP_V pyproject=$PY_V uv.lock=$LOCK_V"
          test "$APP_V" = "$PY_V" && test "$APP_V" = "$LOCK_V"
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_V=$(python - <<'EOF'
          import re
          src = open('fofatoto.py', encoding='utf-8').read()
          print(re.search(r'APP_VERSION\s*=\s*"([^"]+)"', src).group(1))
          EOF
          )
          echo "tag=$GITHUB_REF_NAME APP_VERSION=$APP_V"
          test "v$APP_V" = "$GITHUB_REF_NAME"

  build-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install nuitka zstandard

      - name: Build
        run: python -m nuitka --onefile --lto=yes --remove-output --assume-yes-for-downloads --python-flag=no_site,no_docstrings --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow --noinclude-unittest-mode=nofollow --noinclude-pydoc-mode=nofollow --noinclude-IPython-mode=nofollow --noinclude-dask-mode=nofollow --noinclude-numba-mode=nofollow --noinclude-default-mode=nofollow --output-dir=dist --output-filename=fofatoto.exe fofatoto.py

      - uses: actions/upload-artifact@v4
        with:
          name: fofatoto-windows_amd64
          path: dist/fofatoto.exe

  build-linux:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # 必须在对应架构的 runner 上编译。此前两项都跑在 ubuntu-latest，
          # 名为 arm64 的产物实际是 amd64。debian:bookworm-slim 是多架构镜像，
          # 跟随 runner 架构拉取。
          - platform: linux_amd64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq \
            python3 python3-dev python3-pip \
            gcc g++ make patchelf wget \
            zstd \
            > /dev/null 2>&1 && rm -rf /var/lib/apt/lists/*

      - name: Install nuitka
        run: pip3 install --break-system-packages nuitka zstandard

      - name: Verify architecture
        run: |
          machine=$(python3 -c 'import platform; print(platform.machine())')
          echo "machine=$machine expected=${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "linux_arm64" ]; then
            test "$machine" = "aarch64"
          else
            test "$machine" = "x86_64"
          fi

      - name: Build
        run: python3 -m nuitka --onefile --lto=yes --static-libpython=yes --remove-output --assume-yes-for-downloads --python-flag=no_site,no_docstrings --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow --noinclude-unittest-mode=nofollow --noinclude-pydoc-mode=nofollow --noinclude-IPython-mode=nofollow --noinclude-dask-mode=nofollow --noinclude-numba-mode=nofollow --noinclude-default-mode=nofollow --output-dir=dist --output-filename=fofatoto fofatoto.py

      - name: Copy artifact
        run: cp dist/fofatoto /tmp/fofatoto

      - uses: actions/upload-artifact@v4
        with:
          name: fofatoto-${{ matrix.platform }}
          path: /tmp/fofatoto

  build-macos:
    needs: check
    # 只发布 Apple Silicon（M 系列）。macos-latest 是 arm64；
    # 下面的断言避免 runner 标签漂移后静默编出别的架构。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install nuitka zstandard

      - name: Verify architecture
        run: python3 -c 'import platform; assert platform.machine()=="arm64", platform.machine()'

      - name: Build
        run: python -m nuitka --onefile --lto=yes --static-libpython=yes --remove-output --assume-yes-for-downloads --python-flag=no_site,no_docstrings --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow --noinclude-unittest-mode=nofollow --noinclude-pydoc-mode=nofollow --noinclude-IPython-mode=nofollow --noinclude-dask-mode=nofollow --noinclude-numba-mode=nofollow --noinclude-default-mode=nofollow --output-dir=dist --output-filename=fofatoto fofatoto.py

      - uses: actions/upload-artifact@v4
        with:
          name: fofatoto-macos_arm64
          path: dist/fofatoto

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    # 只在版本 tag 上发布。手动触发仍会编译并上传 artifact，但不会把分支名打成 tag。
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## v$VERSION" '
            index($0, ver)==1 { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf '请查看提交记录获取更新详情。\n' > release_notes.md
          fi
          echo "===== release notes ====="
          cat release_notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare artifacts
        run: |
          cd artifacts
          mv fofatoto-windows_amd64/fofatoto.exe ../fofatoto.exe
          mv fofatoto-linux_amd64/fofatoto ../fofatoto
          mv fofatoto-linux_arm64/fofatoto ../fofatoto_arm64
          mv fofatoto-macos_arm64/fofatoto ../fofatoto_mac_arm64
          cd ..
          rm -rf artifacts
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: fofatoto ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            fofatoto.exe
            fofatoto
            fofatoto_arm64
            fofatoto_mac_arm64
          tag_name: ${{ github.ref_name }}
